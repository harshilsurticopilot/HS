<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>List</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- PapaParse for reading CSV files dynamically -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- Tailwind CSS with Custom Config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2d6a4f',
                        'border-soft': '#e5e9e6',
                        'bg-light': '#f4f7f5',
                        'bg-card-img': '#fcfcfc'
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* CRITICAL MOBILE FIX: Force strict viewport confinement to prevent off-screen shifting */
        html, body, #root { 
            height: 100%; 
            width: 100%; 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
        }
        body { 
            background-color: #f4f7f5; 
            font-family: 'Poppins', sans-serif; 
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Toast Animation */
        @keyframes toastFadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes toastFadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(10px); }
        }
        .toast-enter { animation: toastFadeInUp 0.3s ease forwards; }
        .toast-exit { animation: toastFadeOut 0.3s ease forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- WEBHOOK CONFIGURATION (SECURE) ---
        // REPLACE THIS URL WITH YOUR ACTUAL MAKE.COM WEBHOOK URL
        const ORDER_WEBHOOK_URL = 'https://hook.us2.make.com/c5b9g1rprsaqe3qn3apeb6nr0hhmycj9';

        const Toast = ({ message, isVisible }) => {
            if (!isVisible) return null;
            return (
                <div className="fixed bottom-4 md:bottom-8 right-4 md:right-8 z-[9999] toast-enter">
                    <div className="bg-primary text-white px-4 py-3 md:px-5 md:py-3 rounded-lg shadow-[0_10px_30px_rgba(0,0,0,0.15)] flex items-center gap-3 font-medium text-sm md:text-base">
                        <i className="fas fa-check-circle text-lg md:text-xl"></i>
                        {message}
                    </div>
                </div>
            );
        };

        // Escapes special characters to prevent Telegram API crashes when using HTML Parse Mode
        const escapeHtml = (unsafe) => {
            return (unsafe || '').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        };

        // --- PERFECTED: Smart Text Formatter for Clean Product Descriptions ---
        const FormattedText = ({ text }) => {
            if (!text) return null;
            
            let cleanText = text.replace(/<br\s*\/?>/gi, '\n').replace(/\\n/g, '\n');
            cleanText = cleanText.replace(/([^\n])\s*([•🌾📦✅👉✨])/g, '$1\n$2');
            cleanText = cleanText.replace(/\s{2,}/g, '\n');
            const paragraphs = cleanText.split('\n').map(p => p.trim()).filter(p => p);

            return (
                <div className="flex flex-col gap-3 text-sm md:text-[0.95rem] text-gray-600">
                    {paragraphs.map((para, idx) => {
                        if (para.startsWith('•')) {
                            const bulletText = para.substring(1).trim();
                            if (!bulletText) return null;
                            return (
                                <div key={idx} className="flex items-start gap-2.5 ml-1 md:ml-4">
                                    <i className="fas fa-circle text-primary mt-1.5 md:mt-2 opacity-60" style={{ fontSize: '5px' }}></i>
                                    <span className="flex-1 leading-relaxed">{bulletText}</span>
                                </div>
                            );
                        } else if (para.startsWith('- ')) {
                            const bulletText = para.substring(2).trim();
                            if (!bulletText) return null;
                            return (
                                <div key={idx} className="flex items-start gap-2.5 ml-1 md:ml-4">
                                    <i className="fas fa-minus text-primary mt-1.5 md:mt-2 opacity-50" style={{ fontSize: '6px' }}></i>
                                    <span className="flex-1 leading-relaxed">{bulletText}</span>
                                </div>
                            );
                        } else if (para.match(/^(🌾|📦|✅|👉|✨)/) || para.endsWith(':')) {
                            return (
                                <strong key={idx} className="text-gray-800 block mt-2 text-base tracking-tight">{para}</strong>
                            );
                        } else {
                            return <p key={idx} className="leading-relaxed">{para}</p>;
                        }
                    })}
                </div>
            );
        };

        const App = () => {
            const [categories, setCategories] = useState([]);
            const [products, setProducts] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            const [dataError, setDataError] = useState(null);

            const [selectedCategory, setSelectedCategory] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedProduct, setSelectedProduct] = useState(null); 
            const [cart, setCart] = useState([]);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
            const [checkoutData, setCheckoutData] = useState({ name: '', phone: '', email: '', address: '' });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [toastConfig, setToastConfig] = useState({ visible: false, message: '' });

            useEffect(() => {
                const loadStoreData = async () => {
                    try {
                        const cleanHeader = h => h.trim().replace(/^[\uFEFF\xA0]+|[\uFEFF\xA0]+$/g, '');

                        const catResponse = await fetch('./category.csv');
                        if (!catResponse.ok) throw new Error("Failed to load category.csv");
                        let catText = await catResponse.text();
                        let catLines = catText.split(/\r?\n/);
                        const catHeaderIdx = catLines.findIndex(l => l.includes('CategoryID'));
                        if (catHeaderIdx > 0) catText = catLines.slice(catHeaderIdx).join('\n');
                        const catData = Papa.parse(catText, { header: true, skipEmptyLines: true, transformHeader: cleanHeader }).data;
                        const parsedCategories = catData.map(c => ({
                            id: parseInt(c.CategoryID),
                            parentId: c.ParentCategoryID === 'NULL' || !c.ParentCategoryID ? null : parseInt(c.ParentCategoryID),
                            name: c.CategoryName
                        })).filter(c => !isNaN(c.id) && c.name);

                        const mapResponse = await fetch('./productcategories.csv');
                        if (!mapResponse.ok) throw new Error("Failed to load productcategories.csv");
                        let mapText = await mapResponse.text();
                        const mapData = Papa.parse(mapText, { header: false, skipEmptyLines: true }).data;
                        const mappings = {};
                        mapData.forEach(row => {
                            if (row.length >= 2 && row[0] !== 'ProductID') {
                                const pId = parseInt(row[0].trim());
                                const cId = parseInt(row[1].trim());
                                if (!isNaN(pId) && !isNaN(cId)) {
                                    if (!mappings[pId]) mappings[pId] = [];
                                    mappings[pId].push(cId);
                                }
                            }
                        });

                        const prodResponse = await fetch('./products.csv');
                        if (!prodResponse.ok) throw new Error("Failed to load products.csv");
                        let prodText = await prodResponse.text();
                        let prodLines = prodText.split(/\r?\n/);
                        const prodHeaderIdx = prodLines.findIndex(l => l.includes('ProductID'));
                        if (prodHeaderIdx > 0) prodText = prodLines.slice(prodHeaderIdx).join('\n');
                        const prodData = Papa.parse(prodText, { header: true, skipEmptyLines: true, transformHeader: cleanHeader }).data;
                        const parsedProducts = prodData.map(p => {
                            const id = parseInt(p.ProductID);
                            if (isNaN(id)) return null;

                            let catIds = mappings[id] || [];
                            if (catIds.length === 0 && p.CategoryID && p.CategoryID !== 'NULL') catIds = [parseInt(p.CategoryID)];
                            
                            let imgPath = p.MainImagePath ? p.MainImagePath.trim() : '';
                            if (imgPath.startsWith('/')) imgPath = '.' + imgPath;

                            const isActiveStr = p.IsActive ? String(p.IsActive).trim().toLowerCase() : '1';
                            const isActive = isActiveStr === '1' || isActiveStr === 'true';

                            const mrpVal = parseFloat(p.MRP) || 0;
                            const priceVal = parseFloat(p.Price) || mrpVal || 0;

                            return {
                                id: id,
                                categoryIds: catIds,
                                name: p.ProductName,
                                price: priceVal,
                                mrp: mrpVal > priceVal ? mrpVal : null,
                                image: imgPath,
                                isActive: isActive,
                                weight: parseFloat(p.WeightInGrams) || 1000,
                                description: p.Description ? p.Description.trim() : '',
                                shortDescription: p.ShortDescription ? p.ShortDescription.trim() : '',
                                howToUse: p.HowToUse ? p.HowToUse.trim() : '',
                                dosage: p.Dosage ? p.Dosage.trim() : ''
                            };
                        }).filter(p => p !== null && p.name && p.isActive);

                        setCategories(parsedCategories);
                        setProducts(parsedProducts);
                        setIsLoading(false);
                    } catch (err) {
                        console.error("Failed to load CSV store data:", err);
                        setDataError(err.message || "Could not load store data.");
                        setIsLoading(false);
                    }
                };

                loadStoreData();
            }, []);

            const showToast = (message) => {
                setToastConfig({ visible: true, message });
                setTimeout(() => setToastConfig(prev => ({ ...prev, visible: false })), 3000);
            };

            const getCategoryAndDescendants = (catId) => {
                let ids = [catId];
                const children = categories.filter(c => c.parentId === catId).map(c => c.id);
                children.forEach(childId => { ids = ids.concat(getCategoryAndDescendants(childId)); });
                return ids;
            };

            const filteredProducts = useMemo(() => {
                let result = products;
                if (selectedCategory !== null) {
                    const validCatIds = getCategoryAndDescendants(selectedCategory);
                    result = result.filter(p => p.categoryIds.some(id => validCatIds.includes(id)));
                }
                if (searchQuery.trim() !== '') {
                    const lowerQ = searchQuery.toLowerCase();
                    result = result.filter(p => p.name.toLowerCase().includes(lowerQ));
                }
                return result;
            }, [selectedCategory, searchQuery, products, categories]);

            const flatCategories = useMemo(() => {
                const list = [];
                categories.filter(c => c.parentId === null).forEach(parent => {
                    list.push({ ...parent, displayName: parent.name, isChild: false });
                    categories.filter(c => c.parentId === parent.id).forEach(child => {
                        list.push({ ...child, displayName: child.name, isChild: true });
                    });
                });
                return list;
            }, [categories]);

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) {
                        return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item);
                    }
                    return [...prev, { ...product, qty: 1 }];
                });
                showToast("Added to cart!");
            };

            const updateQty = (id, delta) => {
                setCart(prev => {
                    return prev.map(item => {
                        if (item.id === id) {
                            const newQty = item.qty + delta;
                            return newQty > 0 ? { ...item, qty: newQty } : item;
                        }
                        return item;
                    }).filter(item => item.qty > 0);
                });
            };

            const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const cartCount = cart.reduce((sum, item) => sum + item.qty, 0);

            // --- RANGE BASED SHIPPING CALCULATION ---
            const totalWeightGrams = cart.reduce((sum, item) => sum + ((item.weight || 1000) * item.qty), 0);
            const totalWeightKg = Math.max(1, Math.ceil(totalWeightGrams / 1000));
            
            let minShipping = 0;
            let maxShipping = 0;
            
            if (cartCount > 0) {
                minShipping = totalWeightKg * 50;
                maxShipping = minShipping + 50;
            }

            const minFinalAmount = cartTotal + minShipping;
            const maxFinalAmount = cartTotal + maxShipping;
            
            // UI Formatting for ranges
            const shippingDisplay = cartCount > 0 ? `₹${minShipping} - ₹${maxShipping}` : "Free";
            const totalDisplay = cartCount > 0 ? `₹${minFinalAmount} - ₹${maxFinalAmount}` : "₹0";

            const handleCheckoutSubmit = async (e) => {
                e.preventDefault();
                
                if (ORDER_WEBHOOK_URL.includes('YOUR_WEBHOOK_ID')) {
                    alert("Developer Error: Please replace 'YOUR_WEBHOOK_ID' in the code with your actual Make.com Webhook URL.");
                    return;
                }

                setIsSubmitting(true);

                const orderId = Math.floor(100000 + Math.random() * 900000);

                // --- GENERATE PRE-FILLED WHATSAPP MESSAGE ---
                let waText = `Hello ${checkoutData.name},\n\nWe have received your order (#${orderId}).\n\n*Order Details:*\n`;
                cart.forEach((item, index) => {
                    waText += `${index + 1}. ${item.name} - ${item.qty} x ₹${item.price.toFixed(0)}\n`;
                });
                waText += `\n*Subtotal:* ₹${cartTotal.toFixed(0)}\n`;
                waText += `*Est. Shipping:* ${shippingDisplay}\n`;
                waText += `*Est. Final Total:* ${totalDisplay}\n\n`;
                waText += `Please reply to this message to confirm your order and proceed with shipping.`;
                
                // Encode the text so it can safely be passed into the WhatsApp URL
                const encodedWaText = encodeURIComponent(waText);
                const waLink = `https://wa.me/91${checkoutData.phone.replace(/[^0-9]/g, '')}?text=${encodedWaText}`;

                // --- SWITCHED TO HTML FORMATTING WITH SECURE SANITIZATION ---
                // Using escapeHtml() ensures special characters like '&' don't crash Telegram
                let telegramMsg = `🛒 <b>NEW ORDER RECEIVED</b> 🛒\n\n`;
                telegramMsg += `<b>Order ID:</b> #${orderId}\n`;
                telegramMsg += `<b>Customer:</b> ${escapeHtml(checkoutData.name)}\n`;
                telegramMsg += `<b>Phone:</b> ${escapeHtml(checkoutData.phone)}\n`;
                if(checkoutData.email) telegramMsg += `<b>Email:</b> ${escapeHtml(checkoutData.email)}\n`;
                telegramMsg += `<b>Address:</b> ${escapeHtml(checkoutData.address)}\n\n`;
                telegramMsg += `<b>Items Ordered:</b>\n`;
                
                cart.forEach((item, index) => {
                    telegramMsg += `${index + 1}. ${escapeHtml(item.name)} - ${item.qty} x ₹${item.price.toFixed(0)} = ₹${(item.qty * item.price).toFixed(0)}\n`;
                });

                telegramMsg += `\n<b>Subtotal:</b> ₹${cartTotal.toFixed(0)}\n`;
                telegramMsg += `<b>Est. Shipping:</b> ${escapeHtml(shippingDisplay)}\n`;
                telegramMsg += `<b>Est. Final Total:</b> ${escapeHtml(totalDisplay)}\n\n`;
                
                // Add the Clickable pre-filled WhatsApp link to the Telegram payload
                telegramMsg += `📲 <b>Message Customer on WhatsApp:</b>\n<a href="${waLink}">Click here to message customer</a>\n\nRaw Link:\n${waLink}`;

                try {
                    const response = await fetch(ORDER_WEBHOOK_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            // Pass the message safely
                            telegramMessage: telegramMsg,
                            text: telegramMsg,
                            message: telegramMsg,
                            
                            customerName: checkoutData.name,
                            customerPhone: checkoutData.phone,
                            orderId: orderId,
                            orderTotal: totalDisplay
                        })
                    });

                    if (response.ok) {
                        alert(`Order #${orderId} placed successfully! We will contact you soon on WhatsApp to confirm shipping.`);
                        setCart([]);
                        setIsCheckoutOpen(false);
                        setIsCartOpen(false);
                        setCheckoutData({ name: '', phone: '', email: '', address: '' });
                    } else {
                        const errDetails = await response.text();
                        console.error(`Webhook Error (${response.status}):\n${errDetails}`);
                        alert(`Webhook Error (${response.status}): Make.com rejected the request. Please check your Make.com history or settings.`);
                    }
                } catch (error) {
                    console.error("Checkout Network Error:", error);
                    alert("Network Error: Could not reach Make.com.\n\n1. Ensure your Make.com scenario is turned ON ('Run once' or active).\n2. If you are using an AdBlocker or Brave Browser, it may block webhook URLs. Try pausing shields.");
                } finally {
                    setIsSubmitting(false);
                }
            };

            const resetViews = () => {
                setSelectedProduct(null);
            };

            if (isLoading) {
                return (
                    <div className="flex h-full w-full items-center justify-center bg-bg-light text-primary flex-col gap-4">
                        <i className="fas fa-spinner fa-spin text-4xl"></i>
                        <p className="font-semibold text-lg">Loading Catalog...</p>
                    </div>
                );
            }

            if (dataError) {
                return (
                    <div className="flex h-full w-full items-center justify-center bg-bg-light p-4 md:p-6">
                        <div className="bg-white p-6 md:p-8 rounded-2xl shadow-lg w-full max-w-lg text-center border border-red-100">
                            <i className="fas fa-info-circle text-4xl md:text-5xl text-red-500 mx-auto mb-4 block"></i>
                            <h2 className="text-lg md:text-xl font-bold text-gray-800 mb-2">Setup Required</h2>
                            <p className="text-sm md:text-base text-gray-600 mb-4">{dataError}</p>
                            <p className="text-xs md:text-sm text-gray-500 bg-gray-50 p-4 rounded-lg text-left">
                                <strong>Important:</strong><br/>
                                1. Ensure files are named exactly: <code>products.csv</code>, <code>category.csv</code>, <code>productcategories.csv</code><br/>
                                2. They must be in the same folder as this HTML file.<br/>
                                3. <strong>Browsers block reading local files directly.</strong> This will not work if you just double-click the HTML file. It must be uploaded to GitHub Pages or run through a local web server (like VS Code Live Server).
                            </p>
                        </div>
                    </div>
                );
            }

            const inCartDetail = selectedProduct ? cart.find(item => item.id === selectedProduct.id) : null;

            return (
                <div className="flex h-full w-full overflow-hidden bg-bg-light text-gray-800 selection:bg-primary selection:text-white">
                    
                    <Toast message={toastConfig.message} isVisible={toastConfig.visible} />

                    {/* SIDEBAR CATEGORIES */}
                    <aside className="w-64 bg-white border-r border-border-soft flex-col hidden md:flex h-full shadow-[0_10px_40px_rgba(0,0,0,0.03)] z-20 flex-shrink-0 relative">
                        <div className="p-6 bg-primary text-white font-bold text-xl tracking-wide shadow-sm cursor-pointer" onClick={() => { setSelectedCategory(null); setSearchQuery(''); resetViews(); }}>
                            <span className="flex items-center gap-2"><i className="fas fa-list"></i> List</span>
                        </div>
                        <div className="overflow-y-auto flex-1 p-4">
                            <h3 className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">Categories</h3>
                            
                            <button 
                                onClick={() => { setSelectedCategory(null); setSearchQuery(''); resetViews(); }}
                                className={`w-full text-left px-4 py-2.5 mb-1 rounded-lg transition-all duration-200 ${selectedCategory === null && !selectedProduct ? 'bg-[#ebf2ef] text-primary font-semibold border-l-4 border-primary' : 'hover:bg-gray-50 text-gray-600 border-l-4 border-transparent'}`}
                            >
                                All Products
                            </button>

                            {categories.filter(c => c.parentId === null).map(parentCat => (
                                <div key={parentCat.id} className="mb-1">
                                    <button 
                                        onClick={() => { setSelectedCategory(parentCat.id); setSearchQuery(''); resetViews(); }}
                                        className={`w-full text-left px-4 py-2.5 rounded-lg transition-all duration-200 ${selectedCategory === parentCat.id && !selectedProduct ? 'bg-[#ebf2ef] text-primary font-semibold border-l-4 border-primary' : 'hover:bg-gray-50 text-gray-600 border-l-4 border-transparent'}`}
                                    >
                                        {parentCat.name}
                                    </button>
                                    
                                    {/* Render Nested Subcategories if they exist */}
                                    {categories.filter(c => c.parentId === parentCat.id).length > 0 && (
                                        <div className="ml-4 mt-1 border-l-2 border-gray-100 pl-2 space-y-1">
                                            {categories.filter(c => c.parentId === parentCat.id).map(childCat => (
                                                <button 
                                                    key={childCat.id}
                                                    onClick={() => { setSelectedCategory(childCat.id); setSearchQuery(''); resetViews(); }}
                                                    className={`w-full text-left px-4 py-1.5 text-sm rounded-lg transition-all duration-200 ${selectedCategory === childCat.id && !selectedProduct ? 'bg-[#ebf2ef] text-primary font-semibold' : 'hover:bg-gray-50 text-gray-500'}`}
                                                >
                                                    {childCat.name}
                                                </button>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            ))}
                        </div>
                    </aside>

                    {/* MAIN CONTENT AREA - with min-w-0 to prevent horizontal expansion issues */}
                    <main className="flex-1 flex flex-col h-full relative min-w-0 overflow-hidden">
                        
                        {/* MOBILE STICKY TOP NAV */}
                        <div className="md:hidden z-30 w-full flex flex-col shadow-sm flex-shrink-0 min-w-0">
                            {/* Mobile Header */}
                            <header className="flex justify-between items-center bg-primary p-4 text-white w-full">
                                <h1 className="font-bold text-lg flex items-center gap-2 cursor-pointer" onClick={() => { setSelectedCategory(null); setSearchQuery(''); resetViews(); }}><i className="fas fa-list"></i> List</h1>
                                <button onClick={() => setIsCartOpen(true)} className="relative p-2">
                                    <i className="fas fa-shopping-cart text-xl"></i>
                                    {cartCount > 0 && (
                                        <span className="absolute top-0 right-0 bg-[#e74c3c] text-white text-[10px] font-bold rounded-full w-5 h-5 flex items-center justify-center border-2 border-primary">
                                            {cartCount}
                                        </span>
                                    )}
                                </button>
                            </header>

                            {/* Mobile Category Scroll */}
                            <div className="bg-white border-b border-border-soft overflow-x-auto hide-scrollbar p-3 flex gap-2 items-center w-full">
                                <button 
                                    onClick={() => { setSelectedCategory(null); setSearchQuery(''); resetViews(); }}
                                    className={`flex-shrink-0 px-5 py-2 text-sm rounded-full transition-colors ${selectedCategory === null && !selectedProduct ? 'bg-primary text-white font-medium' : 'bg-white text-gray-600 border border-border-soft hover:bg-gray-50'}`}
                                >
                                    All Products
                                </button>
                                {flatCategories.map(cat => (
                                    <button 
                                        key={cat.id}
                                        onClick={() => { setSelectedCategory(cat.id); setSearchQuery(''); resetViews(); }}
                                        className={`flex-shrink-0 px-5 py-2 text-sm rounded-full transition-colors ${selectedCategory === cat.id && !selectedProduct ? 'bg-primary text-white font-medium' : 'bg-white text-gray-600 border border-border-soft hover:bg-gray-50'}`}
                                    >
                                        {cat.displayName}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* MAIN SCROLL AREA */}
                        <div className="flex-1 overflow-y-auto overflow-x-hidden p-3 md:p-8 w-full min-h-0 relative">
                            
                            {!selectedProduct ? (
                                /* ----- PRODUCT GRID VIEW ----- */
                                <>
                                    <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-5 md:mb-8 max-w-7xl mx-auto gap-3 md:gap-4 w-full">
                                        <div className="w-full md:w-auto">
                                            <h2 className="text-xl md:text-3xl font-bold text-gray-800 tracking-tight">
                                                {categories.find(c => c.id === selectedCategory)?.name || 'All Products'}
                                                {searchQuery && <span className="text-sm md:text-lg text-gray-500 font-normal ml-2 block mt-1 md:inline md:mt-0">| Search: "{searchQuery}"</span>}
                                            </h2>
                                            <p className="text-gray-500 text-xs md:text-sm mt-1 hidden md:block">Explore our premium selection</p>
                                        </div>
                                        
                                        <div className="flex items-center gap-3 w-full md:w-auto">
                                            {/* Search Bar */}
                                            <div className="relative flex-1 md:w-64">
                                                <input 
                                                    type="text" 
                                                    placeholder="Search products..." 
                                                    value={searchQuery}
                                                    onChange={(e) => setSearchQuery(e.target.value)}
                                                    className="w-full pl-10 pr-8 py-2.5 bg-white border border-border-soft rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-sm md:text-base shadow-sm"
                                                />
                                                <i className="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                                                {searchQuery && (
                                                    <button onClick={() => setSearchQuery('')} className="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 focus:outline-none p-2">
                                                        <i className="fas fa-times"></i>
                                                    </button>
                                                )}
                                            </div>

                                            <button 
                                                onClick={() => setIsCartOpen(true)}
                                                className="hidden md:flex items-center gap-2 bg-white border border-border-soft hover:border-primary text-primary px-5 py-2.5 rounded-xl shadow-sm transition-all duration-200 hover:shadow-md font-medium"
                                            >
                                                <i className="fas fa-shopping-cart"></i>
                                                Cart
                                                {cartCount > 0 && <span className="bg-primary text-white text-xs px-2 py-0.5 rounded-full ml-1">{cartCount}</span>}
                                            </button>
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 md:gap-6 pb-24 max-w-7xl mx-auto w-full">
                                        {filteredProducts.map(product => {
                                            const inCart = cart.find(item => item.id === product.id);
                                            return (
                                                <div 
                                                    key={product.id} 
                                                    onClick={() => setSelectedProduct(product)}
                                                    className="bg-white rounded-xl md:rounded-2xl shadow-sm border border-border-soft overflow-hidden flex flex-col hover:shadow-[0_10px_40px_rgba(0,0,0,0.06)] transition-all duration-300 group relative cursor-pointer h-full"
                                                >
                                                    <div className="h-32 sm:h-44 md:h-52 bg-bg-card-img w-full relative flex items-center justify-center p-2.5 md:p-4 overflow-hidden border-b border-gray-50">
                                                        <img 
                                                            src={product.image} 
                                                            alt={product.name} 
                                                            className="w-full h-full object-contain mix-blend-multiply group-hover:scale-105 transition-transform duration-500"
                                                            onError={(e) => { e.target.src = 'https://via.placeholder.com/300x300.png?text=No+Image'; }}
                                                        />
                                                    </div>
                                                    <div className="p-2.5 md:p-4 flex-1 flex flex-col justify-between bg-white w-full">
                                                        <div>
                                                            <h3 className="text-xs sm:text-sm md:text-base font-semibold text-gray-800 line-clamp-2 leading-tight md:leading-snug mb-1 group-hover:text-primary transition-colors">{product.name}</h3>
                                                        </div>
                                                        <div className="mt-2 md:mt-3">
                                                            <div className="flex flex-wrap items-center gap-1.5 md:gap-2 mb-2 md:mb-3">
                                                                <span className="text-sm sm:text-lg font-bold text-primary">₹{product.price.toFixed(0)}</span>
                                                                {product.mrp && <span className="text-[10px] sm:text-xs text-gray-400 line-through">₹{product.mrp.toFixed(0)}</span>}
                                                            </div>
                                                            
                                                            <div onClick={(e) => e.stopPropagation()} className="w-full">
                                                                {inCart ? (
                                                                    <div className="flex items-center justify-between border border-primary rounded-lg overflow-hidden bg-white w-full">
                                                                        <button onClick={() => updateQty(product.id, -1)} className="px-2.5 py-1.5 md:px-3 md:py-1.5 text-primary hover:bg-[#ebf2ef] transition-colors w-1/3 flex justify-center items-center"><i className="fas fa-minus text-[10px] md:text-xs"></i></button>
                                                                        <span className="font-semibold text-primary text-center w-1/3 text-xs md:text-base">{inCart.qty}</span>
                                                                        <button onClick={() => updateQty(product.id, 1)} className="px-2.5 py-1.5 md:px-3 md:py-1.5 text-primary hover:bg-[#ebf2ef] transition-colors w-1/3 flex justify-center items-center"><i className="fas fa-plus text-[10px] md:text-xs"></i></button>
                                                                    </div>
                                                                ) : (
                                                                    <button 
                                                                        onClick={() => addToCart(product)}
                                                                        className="w-full bg-white border border-primary text-primary hover:bg-primary hover:text-white py-1.5 md:py-2 rounded-lg font-semibold transition-all duration-200 text-[11px] sm:text-sm flex justify-center items-center gap-1.5 md:gap-2"
                                                                    >
                                                                        <i className="fas fa-shopping-cart text-[10px] md:text-base"></i> 
                                                                        <span className="hidden sm:inline">Add to Cart</span>
                                                                        <span className="sm:hidden">Add</span>
                                                                    </button>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                        {filteredProducts.length === 0 && (
                                            <div className="col-span-full py-12 md:py-16 text-center text-gray-500 flex flex-col items-center w-full">
                                                <i className="fas fa-box-open text-5xl md:text-6xl text-gray-300 mb-3 block"></i>
                                                <p className="font-medium text-sm md:text-lg">No products found for this selection.</p>
                                            </div>
                                        )}
                                    </div>
                                </>

                            ) : (

                                /* ----- PRODUCT DETAILS VIEW ----- */
                                <div className="max-w-6xl mx-auto bg-white rounded-xl md:rounded-3xl p-4 sm:p-6 md:p-10 shadow-sm border border-border-soft relative animate-[toastFadeInUp_0.3s_ease-out] mb-10 w-full">
                                    <button 
                                        onClick={() => setSelectedProduct(null)}
                                        className="mb-4 md:mb-6 text-gray-500 hover:text-primary transition-colors flex items-center gap-2 font-medium bg-gray-50 px-3 md:px-4 py-1.5 md:py-2 rounded-lg border border-gray-100 hover:bg-[#ebf2ef] hover:border-primary inline-flex text-xs md:text-base"
                                    >
                                        <i className="fas fa-arrow-left"></i> Back to Products
                                    </button>
                                    
                                    <div className="flex flex-col md:flex-row gap-5 md:gap-14 w-full">
                                        {/* Product Image Section */}
                                        <div className="w-full md:w-1/2">
                                            <div className="bg-bg-card-img rounded-xl md:rounded-2xl border border-border-soft p-4 md:p-8 h-56 sm:h-80 md:h-[500px] flex items-center justify-center shadow-inner">
                                                <img 
                                                    src={selectedProduct.image} 
                                                    alt={selectedProduct.name} 
                                                    className="w-full h-full object-contain mix-blend-multiply hover:scale-105 transition-transform duration-500"
                                                    onError={(e) => { e.target.src = 'https://via.placeholder.com/500x500.png?text=No+Image'; }}
                                                />
                                            </div>
                                        </div>
                                        
                                        {/* Product Info Section */}
                                        <div className="w-full md:w-1/2 flex flex-col justify-start pt-1 md:pt-2">
                                            <h1 className="text-2xl sm:text-3xl md:text-4xl font-bold text-gray-800 leading-tight mb-2 md:mb-3">{selectedProduct.name}</h1>
                                            
                                            {selectedProduct.shortDescription && (
                                                <p className="text-gray-500 text-sm md:text-lg mb-4 md:mb-6 leading-relaxed">{selectedProduct.shortDescription}</p>
                                            )}
                                            
                                            <div className="flex items-end gap-3 md:gap-4 mb-1 md:mb-2">
                                                <span className="text-3xl md:text-4xl font-extrabold text-primary">₹{selectedProduct.price.toFixed(0)}</span>
                                                {selectedProduct.mrp && (
                                                    <span className="text-lg md:text-2xl text-gray-400 line-through mb-0.5 md:mb-1">₹{selectedProduct.mrp.toFixed(0)}</span>
                                                )}
                                            </div>
                                            <p className="text-[11px] md:text-sm text-gray-400 mb-5 md:mb-8 font-medium">Inclusive of all taxes</p>
                                            
                                            <div className="mb-6 md:mb-10 w-full sm:w-3/4">
                                                {inCartDetail ? (
                                                    <div className="flex items-center justify-between border-2 border-primary rounded-xl overflow-hidden bg-white w-full sm:max-w-xs shadow-sm">
                                                        <button onClick={() => updateQty(selectedProduct.id, -1)} className="px-6 py-2.5 md:py-3.5 text-primary hover:bg-[#ebf2ef] transition-colors"><i className="fas fa-minus"></i></button>
                                                        <span className="font-bold text-primary text-lg md:text-xl px-4">{inCartDetail.qty}</span>
                                                        <button onClick={() => updateQty(selectedProduct.id, 1)} className="px-6 py-2.5 md:py-3.5 text-primary hover:bg-[#ebf2ef] transition-colors"><i className="fas fa-plus"></i></button>
                                                    </div>
                                                ) : (
                                                    <button onClick={() => addToCart(selectedProduct)} className="w-full sm:max-w-xs bg-primary hover:bg-[#20503b] text-white py-3.5 md:py-4 rounded-xl font-bold text-sm md:text-lg shadow-[0_8px_20px_rgba(45,106,79,0.3)] transition-all transform hover:-translate-y-1 flex justify-center items-center gap-2 md:gap-3">
                                                        <i className="fas fa-cart-plus text-base md:text-xl"></i> Add to Cart
                                                    </button>
                                                )}
                                            </div>
                                            
                                            {/* Details Accordion style */}
                                            <div className="border-t border-border-soft pt-5 md:pt-8 space-y-5 md:space-y-8 w-full">
                                                {selectedProduct.description && (
                                                    <div className="w-full">
                                                        <h3 className="text-base md:text-lg font-bold text-gray-800 mb-2 md:mb-3 flex items-center gap-2 md:gap-3"><i className="fas fa-info-circle text-primary text-base md:text-xl"></i> Product Description</h3>
                                                        <FormattedText text={selectedProduct.description} />
                                                    </div>
                                                )}
                                                {selectedProduct.howToUse && (
                                                    <div className="w-full">
                                                        <h3 className="text-base md:text-lg font-bold text-gray-800 mb-2 md:mb-3 flex items-center gap-2 md:gap-3"><i className="fas fa-leaf text-primary text-base md:text-xl"></i> How to Use</h3>
                                                        <FormattedText text={selectedProduct.howToUse} />
                                                    </div>
                                                )}
                                                {selectedProduct.dosage && (
                                                    <div className="w-full">
                                                        <h3 className="text-base md:text-lg font-bold text-gray-800 mb-2 md:mb-3 flex items-center gap-2 md:gap-3"><i className="fas fa-balance-scale text-primary text-base md:text-xl"></i> Dosage Instructions</h3>
                                                        <FormattedText text={selectedProduct.dosage} />
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>

                    {/* CART OVERLAY / SLIDEOUT */}
                    {isCartOpen && (
                        <div className="fixed inset-0 z-50 flex justify-end">
                            {/* Backdrop */}
                            <div className="absolute inset-0 bg-black/40 backdrop-blur-sm transition-opacity" onClick={() => setIsCartOpen(false)}></div>
                            
                            {/* Panel */}
                            <div className="relative w-full sm:w-[400px] max-w-md bg-white h-full shadow-2xl flex flex-col animate-[slideIn_0.3s_ease-out]">
                                <style>{`@keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }`}</style>
                                
                                <div className="p-4 md:p-5 border-b border-border-soft flex justify-between items-center bg-white">
                                    <h2 className="text-lg md:text-xl font-bold flex items-center gap-2 text-primary">
                                        <i className="fas fa-shopping-cart text-lg md:text-xl"></i> Your Cart
                                    </h2>
                                    <button onClick={() => setIsCartOpen(false)} className="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full transition-colors">
                                        <i className="fas fa-times text-lg md:text-xl"></i>
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-3 md:p-5 space-y-3 md:space-y-4 bg-bg-light">
                                    {cart.length === 0 ? (
                                        <div className="text-center py-10 md:py-12 text-gray-500 flex flex-col items-center">
                                            <div className="bg-white p-4 rounded-full shadow-sm mb-4">
                                                <i className="fas fa-shopping-bag text-3xl md:text-4xl text-gray-300 block"></i>
                                            </div>
                                            <p className="font-medium text-sm md:text-base">Your cart is empty.</p>
                                            <button onClick={() => setIsCartOpen(false)} className="mt-4 text-primary text-sm font-semibold hover:underline">Continue Shopping</button>
                                        </div>
                                    ) : (
                                        cart.map(item => (
                                            <div key={item.id} className="flex gap-2.5 md:gap-4 p-2.5 md:p-3 bg-white rounded-xl shadow-sm border border-border-soft">
                                                <div className="w-16 h-16 md:w-20 md:h-20 bg-bg-card-img rounded-lg border border-gray-100 p-1 flex-shrink-0 cursor-pointer" onClick={() => { setSelectedProduct(item); setIsCartOpen(false); }}>
                                                    <img src={item.image} alt={item.name} className="w-full h-full object-contain mix-blend-multiply" onError={(e) => { e.target.src = 'https://via.placeholder.com/100?text=No+Image'; }} />
                                                </div>
                                                <div className="flex-1 flex flex-col justify-between py-0.5">
                                                    <h4 className="text-[13px] md:text-sm font-semibold text-gray-800 line-clamp-2 leading-tight cursor-pointer hover:text-primary transition-colors" onClick={() => { setSelectedProduct(item); setIsCartOpen(false); }}>{item.name}</h4>
                                                    <div className="flex items-center justify-between mt-1 md:mt-2">
                                                        <div className="text-primary font-bold text-sm">₹{item.price.toFixed(0)}</div>
                                                        <div className="flex items-center justify-between border border-border-soft rounded-md bg-white w-[70px] md:w-20">
                                                            <button onClick={() => updateQty(item.id, -1)} className="px-2 py-1 md:px-2 md:py-1 text-gray-500 hover:text-primary hover:bg-gray-50"><i className="fas fa-minus text-[10px] md:text-xs"></i></button>
                                                            <span className="text-[11px] md:text-xs font-semibold">{item.qty}</span>
                                                            <button onClick={() => updateQty(item.id, 1)} className="px-2 py-1 md:px-2 md:py-1 text-gray-500 hover:text-primary hover:bg-gray-50"><i className="fas fa-plus text-[10px] md:text-xs"></i></button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        ))
                                    )}
                                </div>

                                {cart.length > 0 && (
                                    <div className="p-4 md:p-5 border-t border-border-soft bg-white shadow-[0_-10px_20px_rgba(0,0,0,0.02)]">
                                        <div className="flex justify-between items-center mb-1.5 md:mb-2 text-xs md:text-sm text-gray-600">
                                            <span>Subtotal:</span>
                                            <span className="font-semibold">₹{cartTotal.toFixed(0)}</span>
                                        </div>
                                        <div className="flex justify-between items-center mb-3 md:mb-4 text-xs md:text-sm text-gray-600">
                                            <span>Est. Shipping:</span>
                                            <span className="font-semibold">{shippingDisplay}</span>
                                        </div>
                                        <div className="flex justify-between items-center mb-3 md:mb-4 text-base md:text-lg border-t border-border-soft pt-2 md:pt-3">
                                            <span className="font-semibold text-gray-800">Estimated Total:</span>
                                            <span className="font-bold text-primary text-lg md:text-xl">{totalDisplay}</span>
                                        </div>
                                        <p className="text-[10px] md:text-xs text-gray-400 italic mb-3 md:mb-4 text-right">* Final shipping confirmed prior to dispatch.</p>
                                        <button 
                                            onClick={() => setIsCheckoutOpen(true)}
                                            className="w-full bg-primary hover:bg-[#20503b] text-white py-3 md:py-3.5 rounded-xl font-bold shadow-md transition-colors flex justify-center items-center gap-2 text-sm md:text-base"
                                        >
                                            Proceed to Secure Checkout <i className="fas fa-arrow-right"></i>
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* CHECKOUT MODAL - Converted to Bottom-Sheet on Mobile */}
                    {isCheckoutOpen && (
                        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onClick={() => setIsCheckoutOpen(false)}></div>
                            
                            <div className="relative bg-white w-full h-[85vh] sm:h-auto sm:max-w-lg rounded-t-2xl sm:rounded-2xl shadow-2xl flex flex-col sm:max-h-[90vh] animate-[toastFadeInUp_0.3s_ease-out] min-w-0">
                                <div className="p-4 md:p-5 border-b border-border-soft flex justify-between items-center bg-white sticky top-0 z-10 rounded-t-2xl sm:rounded-2xl">
                                    <h2 className="text-lg md:text-xl font-bold text-primary flex items-center gap-2">
                                        <i className="fas fa-lock text-lg md:text-xl"></i> Secure Checkout
                                    </h2>
                                    <button onClick={() => setIsCheckoutOpen(false)} className="text-gray-400 hover:text-gray-600 hover:bg-gray-100 p-2 rounded-full transition-colors">
                                        <i className="fas fa-times text-lg"></i>
                                    </button>
                                </div>
                                
                                <div className="overflow-y-auto p-4 md:p-6 bg-white flex-1 w-full">
                                    <form id="checkout-form" onSubmit={handleCheckoutSubmit} className="space-y-3 md:space-y-4">
                                        <div>
                                            <label className="block text-xs md:text-sm font-semibold text-gray-700 mb-1">Full Name</label>
                                            <input 
                                                required 
                                                type="text" 
                                                className="w-full p-2.5 md:p-3 bg-[#fafafa] border border-border-soft rounded-lg focus:ring-2 focus:ring-primary outline-none transition-all text-base"
                                                value={checkoutData.name}
                                                onChange={e => setCheckoutData({...checkoutData, name: e.target.value})}
                                            />
                                        </div>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-3 md:gap-4">
                                            <div>
                                                <label className="block text-xs md:text-sm font-semibold text-gray-700 mb-1">Contact Number</label>
                                                <input 
                                                    required 
                                                    type="tel" 
                                                    className="w-full p-2.5 md:p-3 bg-[#fafafa] border border-border-soft rounded-lg focus:ring-2 focus:ring-primary outline-none transition-all text-base"
                                                    value={checkoutData.phone}
                                                    onChange={e => setCheckoutData({...checkoutData, phone: e.target.value})}
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs md:text-sm font-semibold text-gray-700 mb-1">Email (Optional)</label>
                                                <input 
                                                    type="email" 
                                                    className="w-full p-2.5 md:p-3 bg-[#fafafa] border border-border-soft rounded-lg focus:ring-2 focus:ring-primary outline-none transition-all text-base"
                                                    value={checkoutData.email}
                                                    onChange={e => setCheckoutData({...checkoutData, email: e.target.value})}
                                                />
                                            </div>
                                        </div>
                                        <div>
                                            <label className="block text-xs md:text-sm font-semibold text-gray-700 mb-1">Complete Shipping Address</label>
                                            <textarea 
                                                required 
                                                rows="3"
                                                className="w-full p-2.5 md:p-3 bg-[#fafafa] border border-border-soft rounded-lg focus:ring-2 focus:ring-primary outline-none resize-none transition-all text-base"
                                                value={checkoutData.address}
                                                onChange={e => setCheckoutData({...checkoutData, address: e.target.value})}
                                            ></textarea>
                                        </div>
                                        
                                        <div className="bg-[#f8faf9] p-3 md:p-4 rounded-xl mt-4 md:mt-6 border border-border-soft shadow-sm w-full">
                                            <div className="flex justify-between items-center text-xs md:text-sm text-gray-600 mb-1">
                                                <span>Subtotal:</span>
                                                <span className="font-semibold">₹{cartTotal.toFixed(0)}</span>
                                            </div>
                                            <div className="flex justify-between items-center text-xs md:text-sm text-gray-600 mb-2 md:mb-3 border-b border-border-soft pb-2 md:pb-3">
                                                <span>Est. Shipping:</span>
                                                <span className="font-semibold">{shippingDisplay}</span>
                                            </div>
                                            <div className="flex justify-between items-center text-base md:text-lg font-bold text-gray-800">
                                                <span>Total to Pay:</span>
                                                <span className="text-primary text-lg md:text-xl">{totalDisplay}</span>
                                            </div>
                                            <div className="flex items-start gap-2 mt-2 md:mt-3 text-[10px] md:text-xs text-gray-500 bg-white p-2 rounded border border-gray-100">
                                                <i className="fas fa-info-circle text-primary flex-shrink-0 mt-0.5 md:mt-1"></i>
                                                <p>Payment and shipping instructions will be shared after order placement.</p>
                                            </div>
                                        </div>
                                    </form>
                                </div>

                                <div className="p-4 md:p-5 border-t border-border-soft bg-gray-50 sm:rounded-b-2xl flex gap-3 pb-8 sm:pb-4 w-full">
                                    <button 
                                        type="button"
                                        onClick={() => setIsCheckoutOpen(false)}
                                        className="flex-1 py-3 md:py-3.5 bg-white border border-border-soft text-gray-700 rounded-xl font-semibold hover:bg-gray-50 transition-colors text-sm md:text-base"
                                    >
                                        Cancel
                                    </button>
                                    <button 
                                        type="submit"
                                        form="checkout-form"
                                        disabled={isSubmitting}
                                        className="flex-1 py-3 md:py-3.5 bg-primary text-white rounded-xl font-bold shadow hover:bg-[#20503b] transition-all disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center gap-2 text-sm md:text-base"
                                    >
                                        {isSubmitting ? (
                                            <span className="flex items-center gap-2"><i className="fas fa-spinner fa-spin text-lg md:text-xl"></i> Processing...</span>
                                        ) : (
                                            <span className="flex items-center gap-2"><i className="fas fa-check-circle text-lg md:text-xl"></i> Place Order</span>
                                        )}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
